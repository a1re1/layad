[package]
name = "layad"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Local HTTP daemon that keeps one Laya decision model resident"
readme = "README.md"
publish = false

[lib]
name = "layad"
path = "src/lib.rs"

[[bin]]
name = "layad"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "signal", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
http-body-util = "0.1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
